name: General AndyHQ support
description: Use this if your app is not listed in the app-specific forms
title: "[Support] "
labels: ["support", "app:general"]
body:
  - type: markdown
    attributes:
      value: "For Landlord Assistant or Outflow, please use the app-specific form so the ticket gets the right app label automatically."
  - type: dropdown
    id: app
    attributes:
      label: Which app?
      options:
        - Overtime Live
        - Sun Hours
        - Other / general
    validations:
      required: true
  - type: dropdown
    id: request_type
    attributes:
      label: What type of request is this?
      options:
        - Bug
        - Feature request
        - Privacy question
        - General question
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened or what would you like?
      description: Describe the bug, question, or request.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS, if relevant
      placeholder: "Example: iPhone 15, iOS 26.0"
    validations:
      required: false
