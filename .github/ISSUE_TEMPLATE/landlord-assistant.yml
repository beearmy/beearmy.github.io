name: "Landlord Assistant: Rent"
description: "Report a bug, ask a question, or request a feature for Landlord Assistant: Rent"
title: "[Landlord] "
labels: ["support", "app:landlord"]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting this. This form automatically adds the app:landlord tag so it lands in the Landlord Assistant queue. Please do not attach private tenancy documents, addresses, or payment details."
  - type: dropdown
    id: request_type
    attributes:
      label: What do you need?
      options:
        - Something is broken
        - I expected a different result
        - I want a feature
        - iCloud sync or restore help
        - Purchase or subscription help
        - Privacy question
        - General question
    validations:
      required: true
  - type: dropdown
    id: app_area
    attributes:
      label: Where in the app?
      options:
        - Today
        - Homes
        - People
        - Rent
        - Vault / paperwork
        - Tax Pack
        - Risk Radar / tasks
        - iCloud sync
        - Settings
        - Purchases / Pro
        - App Store / TestFlight
        - Not sure
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Keep it short and plain English. One issue per ticket is best.
      placeholder: "Example: I uploaded a gas safety PDF in Vault but there was no obvious way to save it."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we make it happen again?
      description: Add steps only if you know them.
      placeholder: |
        1. Open Vault
        2. Tap Add paperwork
        3. Upload a PDF
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: What should have happened?
      placeholder: "Example: I expected a clear Save paperwork button and for the document to appear in Vault."
    validations:
      required: false
  - type: dropdown
    id: impact
    attributes:
      label: How much does this affect you?
      options:
        - Not blocking, just annoying
        - Slows me down
        - Blocks part of the app
        - Blocking me from using the app
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: App version, if you know it
      placeholder: "Example: 1.0.2 (6)"
    validations:
      required: false
  - type: input
    id: device
    attributes:
      label: Device and OS
      placeholder: "Example: iPhone 15 Pro, iOS 26.0"
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or extra context
      description: Drag screenshots, screen recordings, or a short note here if it helps.
    validations:
      required: false
