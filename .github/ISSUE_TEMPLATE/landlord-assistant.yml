name: Landlord Assistant support
description: "Report a bug, ask a question, or request a feature for Landlord Assistant: Rent"
title: "[Landlord] "
labels: ["support", "app:landlord"]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting this. Add the useful bits below and the ticket will be labelled for Landlord Assistant automatically."
  - type: dropdown
    id: request_type
    attributes:
      label: What type of request is this?
      options:
        - Bug
        - Feature request
        - iCloud sync
        - Purchase or subscription
        - Privacy question
        - General question
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened or what would you like?
      description: A short plain-English description is perfect.
      placeholder: "Example: Rent shows late when the payment is due on the last Friday of the month."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce, if it is a bug
      placeholder: |
        1. Open People
        2. Edit a person
        3. Set rent date...
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: "What should the app have done instead?"
    validations:
      required: false
  - type: dropdown
    id: impact
    attributes:
      label: How much is this blocking you?
      options:
        - Not blocking, just annoying
        - Blocking part of the app
        - Blocking me from using the app
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: App version, if you know it
      placeholder: "Example: 1.0.2 (6)"
    validations:
      required: false
  - type: input
    id: device
    attributes:
      label: Device and OS
      placeholder: "Example: iPhone 15 Pro, iOS 26.0"
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or extra context
      description: Drag screenshots here if they help explain the issue.
    validations:
      required: false
