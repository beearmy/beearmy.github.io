<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>App Release Tracker — AndyHQ</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 background:#f4f5f7;color:#1d2129;line-height:1.45;padding:20px}
.wrap{max-width:1080px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 16px;margin-bottom:6px}
header.top h1{font-size:22px;margin:0;font-weight:700}
.meta{color:#6b7280;font-size:13px}
.src{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:#e6f0ff;color:#1d4ed8;vertical-align:middle}
.src.manual{background:#fef3c7;color:#92400e}
.summary{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 22px}
.pill{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:10px 14px;font-size:13px;min-width:120px}
.pill b{display:block;font-size:20px;line-height:1.2}
.pill.warn{border-color:#fcd34d;background:#fffbeb}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:16px 18px;margin-bottom:16px;
 box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h2{margin:0 0 2px;font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prio{font-size:11px;font-weight:700;color:#fff;background:#6366f1;border-radius:6px;padding:2px 7px}
.plats{font-size:12px;color:#6b7280}
.next{font-size:13px;margin:6px 0 12px;color:#374151}
.next b{color:#b45309}
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ch{border:1px solid #eef0f2;border-radius:10px;padding:9px 11px;background:#fafbfc}
.ch .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:#6b7280;font-weight:600}
.ch .ver{font-size:15px;font-weight:700;margin:2px 0 5px}
.ch .ver small{font-weight:500;color:#6b7280}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px}
.b-live{background:#dcfce7;color:#166534}
.b-testing{background:#dbeafe;color:#1e40af}
.b-waiting_for_review{background:#fef3c7;color:#92400e}
.b-in_review{background:#ede9fe;color:#5b21b6}
.b-pending_release{background:#cffafe;color:#155e75}
.b-rejected{background:#fee2e2;color:#991b1b}
.b-prepare_for_submission{background:#f3f4f6;color:#374151}
.b-processing{background:#f3f4f6;color:#374151}
a.tf{font-size:12px;color:#2563eb;text-decoration:none}
button#refresh{margin-left:auto;font:inherit;font-size:13px;font-weight:600;cursor:pointer;
 border:1px solid #c7d2fe;background:#eef2ff;color:#3730a3;border-radius:8px;padding:6px 12px}
button#refresh:hover{background:#e0e7ff}
button#refresh:disabled{opacity:.6;cursor:default}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;
 font-size:13px;padding:9px 16px;border-radius:8px;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.show{opacity:1}
footer{color:#9ca3af;font-size:12px;margin-top:8px;text-align:center}
</style></head>
<body><div class="wrap">
<header class="top"><h1>📱 App Release Tracker</h1>
<span class="meta" id="meta"></span>
<button id="refresh">↻ Refresh now</button></header>
<div class="summary" id="summary"></div>
<div id="cards"></div>
<footer>AndyHQ · data from App Store Connect API + manual Android · <span id="foot"></span></footer>
</div>
<div id="toast"></div>
<script>
const REFRESH_TASK_ID="app-release-tracker-refresh";
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
 setTimeout(()=>t.classList.remove('show'),3200);}
(function(){const btn=document.getElementById('refresh');if(!btn)return;
 btn.addEventListener('click',async()=>{
   if(window.cowork&&window.cowork.runScheduledTask){
     btn.disabled=true;btn.textContent='↻ Refreshing…';
     try{await window.cowork.runScheduledTask(REFRESH_TASK_ID);
       toast('Refresh started — pulling App Store Connect. The view updates when it finishes.');}
     catch(e){toast('Could not start refresh: '+e);btn.disabled=false;btn.textContent='↻ Refresh now';}
   } else {location.reload();}
 });
})();
const STATE_LABEL={live:"Live",testing:"Testing",waiting_for_review:"Waiting for Review",
 in_review:"In Review",pending_release:"Pending Release",rejected:"Rejected",
 prepare_for_submission:"Prepare for Submission",processing:"Processing"};
const CH_ORDER=[["ios_live","iOS Live"],["ios_review","iOS Update In Review"],
 ["ios_beta","iOS Beta (External)"],["ios_internal","iOS Internal"],
 ["android_live","Android Live"],["android_beta","Android Beta"]];
function badge(s){const l=STATE_LABEL[s]||s;return `<span class="badge b-${s}">${l}</span>`}
function render(data){
 document.getElementById('meta').innerHTML=
   `<span class="src ${data.source==='manual'?'manual':''}">${data.source==='app-store-connect-api'?'LIVE · App Store Connect':'manual'}</span> `+
   `updated ${new Date(data.generated_at).toLocaleString()}`;
 document.getElementById('foot').textContent='generated '+new Date(data.generated_at).toLocaleString();
 const apps=[...data.apps].sort((a,b)=>(a.priority||99)-(b.priority||99));
 let live=0,testing=0,waiting=0;
 apps.forEach(a=>Object.values(a.channels||{}).forEach(c=>{
   if(c.state==='live')live++;else if(c.state==='testing')testing++;
   else if(c.state==='waiting_for_review'||c.state==='in_review')waiting++;}));
 const waitingApps=apps.filter(a=>Object.values(a.channels||{}).some(c=>c.state==='waiting_for_review'||c.state==='in_review'));
 document.getElementById('summary').innerHTML=
   `<div class="pill"><b>${apps.length}</b>apps tracked</div>`+
   `<div class="pill"><b>${live}</b>live channels</div>`+
   `<div class="pill"><b>${testing}</b>in testing</div>`+
   `<div class="pill warn"><b>${waiting}</b>awaiting review${waitingApps.length?` · ${waitingApps.map(a=>a.name.split(':')[0].split('—')[0].trim()).join(', ')}`:''}</div>`;
 document.getElementById('cards').innerHTML=apps.map(a=>{
   const plats=(a.platforms||[]).map(p=>p==='ios'?'iOS':'Android').join(' + ');
   const chans=CH_ORDER.filter(([k])=>a.channels&&a.channels[k]).map(([k,lbl])=>{
     const c=a.channels[k];
     return `<div class="ch"><div class="lbl">${lbl}</div>
       <div class="ver">${c.version??'—'} <small>(${c.build??'?'})</small></div>${badge(c.state)}</div>`;
   }).join('');
   const tf=a.testflight_url?`<a class="tf" href="${a.testflight_url}" target="_blank">TestFlight ↗</a>`:'';
   const store=a.store_url?` · <a class="tf" href="${a.store_url}" target="_blank">App Store ↗</a>`:'';
   return `<div class="card"><h2><span class="prio">P${a.priority||'?'}</span>${a.name}
     <span class="plats">${plats}</span></h2>
     <div class="next">Next: <b>${a.next_action||'—'}</b></div>
     <div class="chgrid">${chans}</div>
     <div style="margin-top:10px">${tf}${store}</div></div>`;
 }).join('');
}
if(window.APPS_DATA){render(window.APPS_DATA);}
else{fetch('apps.json').then(r=>r.json()).then(render)
  .catch(e=>{document.getElementById('cards').innerHTML='<div class="card">Could not load apps.json: '+e+'</div>';});}
</script></body></html>
