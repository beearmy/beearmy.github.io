<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex">
<title>App Release Tracker — Admin</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 background:#f4f5f7;color:#1d2129;line-height:1.45;padding:20px}
.wrap{max-width:1080px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:6px}
header.top h1{font-size:22px;margin:0;font-weight:700}
.meta{color:#6b7280;font-size:13px}
.src{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:#e6f0ff;color:#1d4ed8}
.src.manual{background:#fef3c7;color:#92400e}
.spacer{flex:1}
.btn{font:inherit;font-size:13px;font-weight:600;cursor:pointer;border-radius:8px;padding:7px 13px;border:1px solid #c7d2fe;background:#eef2ff;color:#3730a3}
.btn:hover{background:#e0e7ff}
.btn.primary{background:#4f46e5;border-color:#4f46e5;color:#fff}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:#fff;border-color:#e5e7eb;color:#374151}
.btn:disabled{opacity:.55;cursor:default}
.summary{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 18px}
.pill{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:10px 14px;font-size:13px;min-width:120px}
.pill b{display:block;font-size:20px;line-height:1.2}
.pill.warn{border-color:#fcd34d;background:#fffbeb}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:16px 18px;margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h2{margin:0 0 2px;font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prio{font-size:11px;font-weight:700;color:#fff;background:#6366f1;border-radius:6px;padding:2px 7px}
.plats{font-size:12px;color:#6b7280}
.next{font-size:13px;margin:6px 0 8px;color:#374151}
.next b{color:#b45309}
.notes{font-size:13px;color:#4b5563;background:#fafafa;border:1px solid #eef0f2;border-radius:8px;padding:8px 11px;margin:0 0 12px;white-space:pre-wrap}
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ch{border:1px solid #eef0f2;border-radius:10px;padding:9px 11px;background:#fafbfc}
.ch .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:#6b7280;font-weight:600}
.ch .ver{font-size:15px;font-weight:700;margin:2px 0 5px}
.ch .ver small{font-weight:500;color:#6b7280}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px}
.b-live{background:#dcfce7;color:#166534}.b-testing{background:#dbeafe;color:#1e40af}
.b-waiting_for_review{background:#fef3c7;color:#92400e}.b-in_review{background:#ede9fe;color:#5b21b6}
.b-pending_release{background:#cffafe;color:#155e75}.b-rejected{background:#fee2e2;color:#991b1b}
.b-prepare_for_submission{background:#f3f4f6;color:#374151}.b-processing{background:#f3f4f6;color:#374151}
.edit-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:8px 0}
.edit-row label{font-size:12px;font-weight:600;color:#6b7280}
select,input,textarea{font:inherit;border:1px solid #d1d5db;border-radius:8px;padding:7px 9px;color:#1d2129;background:#fff}
input.next-in{flex:1;min-width:200px}
textarea.notes-in{width:100%;min-height:64px;resize:vertical;margin-top:4px}
.editing .view-only{display:none}
.edit-fields{display:none}
.editing .edit-fields{display:block}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;font-size:13px;padding:9px 16px;border-radius:8px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
footer{color:#9ca3af;font-size:12px;margin-top:8px;text-align:center}
.hint{font-size:12px;color:#9ca3af;margin-top:4px}
.mhead{font-size:16px;font-weight:700;margin:30px 0 12px;border-top:1px solid #e5e7eb;padding-top:22px}
.mhead .meta{font-weight:400}
.mcard{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.mtitle{font-weight:700;font-size:15px;margin-bottom:10px}
.mstats{display:flex;flex-wrap:wrap;gap:22px}
.mstat b{display:block;font-size:21px;line-height:1.1}
.mstat span{font-size:11.5px;color:#6b7280}
.mreview{margin-top:11px;font-size:13px;color:#4b5563;font-style:italic;background:#fafafa;border:1px solid #eef0f2;border-radius:8px;padding:8px 11px}
.mnote{margin-top:8px;font-size:12px;color:#9ca3af}
</style></head>
<body><div class="wrap" id="app">
<header class="top">
  <h1>📱 App Release Tracker</h1>
  <span class="meta" id="meta"></span>
  <span class="spacer"></span>
  <button class="btn ghost" id="settings" title="Set GitHub token">⚙</button>
  <button class="btn" id="edit">✎ Edit</button>
  <button class="btn primary" id="save" style="display:none">Save</button>
  <button class="btn ghost" id="cancel" style="display:none">Cancel</button>
</header>
<div class="summary" id="summary"></div>
<div id="cards"></div>
<div id="admob"></div>
<div id="metrics"></div>
<footer>AndyHQ admin · live data + your priorities/notes · <span id="foot"></span></footer>
</div>
<div id="toast"></div>
<script>
const REPO="beearmy/beearmy.github.io", OV_PATH="admin/overrides.json", TOKEN_KEY="andyhq_gh_token", LS_DATA="andyhq_admin_last";
const STATE_LABEL={live:"Live",testing:"Testing",waiting_for_review:"Waiting for Review",in_review:"In Review",pending_release:"Pending Release",rejected:"Rejected",prepare_for_submission:"Prepare for Submission",processing:"Processing"};
const CH_ORDER=[["ios_live","iOS Live"],["ios_review","iOS Update In Review"],["ios_beta","iOS Beta (External)"],["ios_internal","iOS Internal"],["android_live","Android Live"],["android_beta","Android Beta"]];
let DATA=null, OVERRIDES={apps:{}}, METRICS=null, ADMOB=null, editing=false;

function toast(m,ms){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),ms||3000);}
function badge(s){return `<span class="badge b-${s}">${STATE_LABEL[s]||s}</span>`}
function ago(ts){const s=(Date.now()-new Date(ts))/1000;if(isNaN(s))return'unknown';if(s<90)return'just now';if(s<5400)return Math.round(s/60)+'m ago';if(s<172800)return Math.round(s/3600)+'h ago';return Math.round(s/86400)+'d ago';}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function merged(){
  const apps=DATA.apps.map(a=>{const o=(OVERRIDES.apps||{})[a.id]||{};return {...a,
    priority:o.priority??a.priority, next_action:o.next_action??a.next_action, notes:o.notes??a.notes??''};});
  return apps.sort((x,y)=>(x.priority||99)-(y.priority||99));
}
function render(stale){
  const isLive=/api/.test(DATA.source||'');
  const when=DATA.generated_at?new Date(DATA.generated_at).toLocaleString():'unknown';
  document.getElementById('meta').innerHTML=`<span class="src ${isLive?'':'manual'}">${isLive?'LIVE · App Store Connect + Google Play':'manual data'}</span>`+(stale?` <span class="src manual">⚠ last saved copy</span>`:'');
  document.getElementById('foot').textContent='version data '+when;
  const apps=merged();
  let live=0,testing=0,waiting=0;
  apps.forEach(a=>Object.values(a.channels||{}).forEach(c=>{if(c.state==='live')live++;else if(c.state==='testing')testing++;else if(c.state==='waiting_for_review'||c.state==='in_review')waiting++;}));
  const wa=apps.filter(a=>Object.values(a.channels||{}).some(c=>c.state==='waiting_for_review'||c.state==='in_review'));
  document.getElementById('summary').innerHTML=
    `<div class="pill" title="${when}"><b>${ago(DATA.generated_at)}</b>version data</div>`+
    `<div class="pill"><b>${apps.length}</b>apps</div>`+
    `<div class="pill"><b>${live}</b>live channels</div>`+
    `<div class="pill"><b>${testing}</b>in testing</div>`+
    `<div class="pill warn"><b>${waiting}</b>awaiting review${wa.length?` · ${wa.map(a=>a.name.split(':')[0].split('—')[0].trim()).join(', ')}`:''}</div>`;
  document.getElementById('cards').innerHTML=apps.map(a=>{
    const plats=(a.platforms||[]).map(p=>p==='ios'?'iOS':'Android').join(' + ');
    const chans=CH_ORDER.filter(([k])=>a.channels&&a.channels[k]).map(([k,lbl])=>{const c=a.channels[k];
      return `<div class="ch"><div class="lbl">${lbl}</div><div class="ver">${c.version??'—'} <small>(${c.build??'?'})</small></div>${badge(c.state)}</div>`;}).join('');
    const notes=a.notes?`<div class="notes view-only">📝 ${esc(a.notes)}</div>`:'';
    const opts=[1,2,3,4,5].map(n=>`<option value="${n}" ${a.priority===n?'selected':''}>P${n}</option>`).join('');
    return `<div class="card" data-id="${a.id}">
      <h2><span class="prio">P${a.priority||'?'}</span>${esc(a.name)} <span class="plats">${plats}</span></h2>
      <div class="next view-only">Next: <b>${esc(a.next_action)||'—'}</b></div>
      ${notes}
      <div class="edit-fields">
        <div class="edit-row">
          <label>Priority <select class="prio-in">${opts}</select></label>
          <label style="flex:1">Next action <input class="next-in" value="${esc(a.next_action)}" placeholder="One-line next step"></label>
        </div>
        <label style="font-size:12px;font-weight:600;color:#6b7280">Notes</label>
        <textarea class="notes-in" placeholder="Free-form notes / context / history">${esc(a.notes)}</textarea>
      </div>
      <div class="chgrid" style="margin-top:10px">${chans}</div>
    </div>`;
  }).join('');
  document.getElementById('app').classList.toggle('editing',editing);
  if(typeof renderMetrics==='function') renderMetrics();
  if(typeof renderAdmob==='function') renderAdmob();
}
function setEditing(on){editing=on;
  document.getElementById('edit').style.display=on?'none':'';
  document.getElementById('save').style.display=on?'':'none';
  document.getElementById('cancel').style.display=on?'':'none';
  render(false);
}
function collect(){
  const apps={};
  document.querySelectorAll('.card').forEach(c=>{
    const id=c.dataset.id;
    apps[id]={priority:parseInt(c.querySelector('.prio-in').value,10),
      next_action:c.querySelector('.next-in').value.trim(),
      notes:c.querySelector('.notes-in').value.trim()};
  });
  return {updated_at:new Date().toISOString(),updated_by:"admin-page",apps};
}
// ---- Token storage: encrypted at rest with a non-extractable Web Crypto key ----
// The AES key lives in IndexedDB and cannot be exported by JS, so the token is never
// readable in plain text (localStorage/DevTools) and the key can't be copied off device.
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('andyhq',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('keys');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function cryptoKey(){const db=await idb();
  const existing=await new Promise((res,rej)=>{const t=db.transaction('keys','readonly').objectStore('keys').get('tok');t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error);});
  if(existing)return existing;
  const k=await crypto.subtle.generateKey({name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  await new Promise((res,rej)=>{const t=db.transaction('keys','readwrite').objectStore('keys').put(k,'tok');t.onsuccess=()=>res();t.onerror=()=>rej(t.error);});
  return k;}
const ENC_KEY="andyhq_gh_token_enc";
async function setToken(tok){const key=await cryptoKey();const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(tok)));
  localStorage.setItem(ENC_KEY,JSON.stringify({iv:btoa(String.fromCharCode(...iv)),ct:btoa(String.fromCharCode(...ct))}));
  localStorage.removeItem(TOKEN_KEY);}
async function decTok(){const raw=localStorage.getItem(ENC_KEY);if(!raw)return null;
  try{const key=await cryptoKey();const b=JSON.parse(raw);
    const iv=Uint8Array.from(atob(b.iv),c=>c.charCodeAt(0));const ct=Uint8Array.from(atob(b.ct),c=>c.charCodeAt(0));
    return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct));}catch(e){return null;}}
async function getToken(){const old=localStorage.getItem(TOKEN_KEY);if(old){await setToken(old.trim());}  // migrate any plain-text token
  return await decTok();}
async function clearToken(){localStorage.removeItem(ENC_KEY);localStorage.removeItem(TOKEN_KEY);
  try{const db=await idb();await new Promise(r=>{const t=db.transaction('keys','readwrite').objectStore('keys').delete('tok');t.onsuccess=()=>r();t.onerror=()=>r();});}catch(e){}}

async function ghCommit(token,obj){
  const url=`https://api.github.com/repos/${REPO}/contents/${OV_PATH}`;
  let sha;
  const g=await fetch(url,{headers:{Authorization:`token ${token}`,Accept:"application/vnd.github+json"}});
  if(g.ok){sha=(await g.json()).sha;} else if(g.status!==404){throw new Error("read "+g.status);}
  const content=btoa(unescape(encodeURIComponent(JSON.stringify(obj,null,2))));
  const r=await fetch(url,{method:"PUT",headers:{Authorization:`token ${token}`,Accept:"application/vnd.github+json"},
    body:JSON.stringify({message:"Update app priorities/notes "+new Date().toISOString().slice(0,10),content,sha})});
  if(!r.ok)throw new Error("save "+r.status+" "+(await r.text()).slice(0,120));
}
async function save(){
  const obj=collect();
  OVERRIDES=obj; localStorage.setItem(LS_DATA,JSON.stringify({DATA,OVERRIDES}));
  let token=await getToken();
  if(!token){const v=prompt("Paste a GitHub token with contents:write on "+REPO+".\nIt is encrypted and stored only in this browser, never on the page or repo.");
    if(v){token=v.trim();await setToken(token);}}
  if(!token){toast("Saved to this browser only (no token). Edits won't sync until you add a token.");setEditing(false);return;}
  document.getElementById('save').disabled=true;
  try{await ghCommit(token,obj);toast("Saved ✓ committed to repo — Claude can read it now.");}
  catch(e){toast("Saved locally; repo save failed: "+e.message,5000);}
  document.getElementById('save').disabled=false;setEditing(false);
}
function fmtProceeds(p){const e=Object.entries(p||{});return e.length?e.map(([c,v])=>`${c} ${v.toFixed(2)}`).join(' · '):null;}
function chg(p){if(p==null)return '';const up=p>=0;return `<span style="color:${up?'#166534':'#991b1b'};font-weight:600">${up?'▲':'▼'} ${Math.abs(p)}%</span>`;}
function renderAdmob(){
  const el=document.getElementById('admob'); if(!ADMOB){el.innerHTML='';return;}
  const cur=ADMOB.currency||'GBP', sym=cur==='GBP'?'£':cur==='USD'?'$':cur==='EUR'?'€':'';
  const when=ADMOB.generated_at?new Date(ADMOB.generated_at).toLocaleString():'';
  const nameOf=id=>((DATA&&DATA.apps.find(a=>a.id===id))||{}).name||id;
  const apps=Object.entries(ADMOB.apps||{}).sort((a,b)=>b[1].earnings_30d-a[1].earnings_30d);
  const rows=apps.map(([id,s])=>{
    const tu=(s.ad_units||[]).filter(u=>u.earnings>0).slice(0,3).map(u=>`${esc(u.name||'?')} ${sym}${u.earnings.toFixed(2)}`).join(' · ');
    return `<div class="mcard"><div class="mtitle">${esc(nameOf(id))} — ${sym}${s.earnings_30d.toFixed(2)} ${chg(s.change_pct)}</div>
      <div class="mstats">
        <div class="mstat"><b>${sym}${s.earnings_30d.toFixed(2)}</b><span>earnings · 30d</span></div>
        <div class="mstat"><b>${sym}${(s.earnings_prev_30d||0).toFixed(2)}</b><span>prior 30d</span></div>
        <div class="mstat"><b>${s.impressions_30d||0}</b><span>impressions</span></div>
        <div class="mstat"><b>${sym}${(s.ecpm||0).toFixed(2)}</b><span>eCPM</span></div>
      </div>${tu?`<div class="mnote">Top ad units: ${tu}</div>`:''}</div>`;
  }).join('');
  el.innerHTML=`<div class="mhead">💰 AdMob revenue <span class="src" style="background:#dcfce7;color:#166534">LIVE · AdMob API</span> <span class="meta" style="color:#9ca3af;font-size:12px">${esc(ADMOB.window||'')} · updated ${when}</span></div>
    <div class="summary"><div class="pill"><b>${sym}${(ADMOB.total_30d||0).toFixed(2)}</b>total · 30d</div><div class="pill"><b>${chg(ADMOB.total_change_pct)||'—'}</b>vs prior 30d</div></div>${rows}`;
}
function renderMetrics(){
  const el=document.getElementById('metrics'); if(!METRICS){el.innerHTML='';return;}
  const when=METRICS.generated_at?new Date(METRICS.generated_at).toLocaleString():'';
  el.innerHTML=`<div class="mhead">📊 Metrics <span class="meta src" style="background:#e6f0ff;color:#1d4ed8">${esc(METRICS.window||'')}</span> <span class="meta" style="color:#9ca3af;font-size:12px">updated ${when}</span></div>`+
    merged().map(a=>{const m=(METRICS.apps||{})[a.id]; if(!m)return''; const i=m.ios||{}, an=m.android||{};
      const stat=(b,s)=>`<div class="mstat"><b>${b}</b><span>${s}</span></div>`;
      let s=stat(i.downloads_4w||0,'iOS downloads · 4w');
      if(i.rating) s+=stat('★'+i.rating, (i.rating_count||0)+' ratings · iOS');
      const rev=fmtProceeds(i.proceeds); if(rev) s+=stat(rev,'revenue · 4w');
      if(i.redownloads_4w) s+=stat(i.redownloads_4w,'re-downloads · 4w');
      if(an.installs_mtd!=null) s+=stat(an.installs_mtd,'Android installs · '+(an.installs_month||'MTD'));
      if(an.active_installs!=null) s+=stat(an.active_installs,'active Android installs');
      if(an.recent_ratings&&an.recent_ratings.length){const avg=(an.recent_ratings.reduce((x,y)=>x+y,0)/an.recent_ratings.length).toFixed(1);s+=stat('★'+avg,an.recent_ratings.length+' recent Android reviews');}
      const u=m.usage||{};
      if(u.active_28d!=null) s+=stat(u.active_28d,'active users · 28d');
      if(u.new_28d!=null) s+=stat(u.new_28d,'new users · 28d');
      if(u.ad_revenue_28d!=null){const cur=u.currency||'USD';const sym=cur==='GBP'?'£':cur==='USD'?'$':cur==='EUR'?'€':'';s+=stat(sym+u.ad_revenue_28d.toFixed(2),'ad revenue · 28d'+(u.ad_impressions_28d!=null?' ('+u.ad_impressions_28d+' impr)':''));}
      if(u.by_platform){const bp=Object.entries(u.by_platform).map(([k,v])=>`${k} ${v}`).join(' · ');s+=stat(bp,'active by platform · 28d');}
      const rv=(i.recent_reviews||[])[0];
      const review=rv?`<div class="mreview">“${esc(rv.title||rv.body||'')}” — ★${rv.rating} ${esc(rv.territory||'')} ${rv.date||''}</div>`:'';
      const liveYet=(i.downloads_4w||i.rating)?'':`<div class="mnote">Not live on the App Store yet.</div>`;
      const aNote=an.note?`<div class="mnote">Android: ${esc(an.note)}.</div>`:'';
      return `<div class="mcard"><div class="mtitle">${esc(a.name)}</div><div class="mstats">${s}</div>${review}${liveYet}${aNote}</div>`;
    }).join('');
}
async function load(){
  try{
    const [a,o,m,ad]=await Promise.all([
      fetch('apps.json').then(r=>r.json()),
      fetch('overrides.json').then(r=>r.ok?r.json():{apps:{}}).catch(()=>({apps:{}})),
      fetch('metrics.json').then(r=>r.ok?r.json():null).catch(()=>null),
      fetch('admob.json').then(r=>r.ok?r.json():null).catch(()=>null)
    ]);
    DATA=a; OVERRIDES=o&&o.apps?o:{apps:{}}; METRICS=m; ADMOB=ad;
    localStorage.setItem(LS_DATA,JSON.stringify({DATA,OVERRIDES,METRICS,ADMOB}));
    render(false); renderMetrics(); renderAdmob();
  }catch(e){
    const c=JSON.parse(localStorage.getItem(LS_DATA)||"null");
    if(c){DATA=c.DATA;OVERRIDES=c.OVERRIDES||{apps:{}};METRICS=c.METRICS||null;ADMOB=c.ADMOB||null;render(true);renderMetrics();renderAdmob();}
    else{document.getElementById('cards').innerHTML='<div class="card">Could not load data: '+e+'</div>';}
  }
}
document.getElementById('edit').onclick=()=>setEditing(true);
document.getElementById('cancel').onclick=()=>setEditing(false);
document.getElementById('save').onclick=save;
document.getElementById('settings').onclick=async()=>{
  const has=await getToken();
  const v=prompt("GitHub token "+(has?"(a token is set)":"(no token set)")+". Paste to set, type CLEAR to remove, or Cancel.\nEncrypted, stored only in this browser.");
  if(v===null)return; if(v.trim().toUpperCase()==="CLEAR"){await clearToken();toast("Token cleared.");}
  else if(v.trim()){await setToken(v.trim());toast("Token saved (encrypted) on this device.");}
};
load();
</script></body></html>
